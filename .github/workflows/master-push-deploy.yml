name: Deploy after merging

on:
  push:
    branches: [ "master" ]

jobs:
  deploying-from-master-branch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v3
      with:
        node-version: 18
    - run: |
        npm ci
        npm run build

    - name: Don't run test after successfull merge
      run: echo "Don't run any test"
