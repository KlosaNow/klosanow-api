name: test pull_request to master branch

on:
  pull_request:
    branches: [ "production" ]

jobs:
  test-pull-request-master:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v3
      with:
        node-version: 18
    - run: |
        npm install -g yarn 
        yarn install
        yarn build

    - name: Install TSLint
      run: npm install -g tslint
      
    # - name: Run TSLint ..........
      # run: npx tslint --config tslint.json 'src/**/*.ts'