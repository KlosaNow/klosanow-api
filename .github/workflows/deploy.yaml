name: Build and Deploy to AWS Environment

on:
    push:
        branches: [otp-auth]

env:
    ECR_REPOSITORY: backend
    AWS_REGION: eu-west-3
    password: password

jobs:
    build:
        name: Build-Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Set Image Tag
              run: |
                  echo "IMAGE_TAG=$(date +%Y-%m-%d-%H-%M)-${GITHUB_SHA::4}" >> $GITHUB_ENV
            ## Checkout the code
            - name: Check out code
              uses: actions/checkout@v2

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{env.AWS_REGION}}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1

            - name: Build, tag, and push image to Amazon ECR
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG  .
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            - name: Edit docker-compose Image Tag
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
              run: |
                  sed -i "5 s|image:.*|image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}|" docker-compose.yml
                  cat docker-compose.yml

            - name: Copy Docker-compose file to the server
              uses: appleboy/scp-action@master
              with:
                  host: ${{ secrets.HOST}}
                  username: ${{ secrets.USERNAME}}
                  key: ${{ secrets.SSHKEY}}
                  port: ${{ secrets.PORT }}
                  source: "./docker-compose.yml"
                  target: "/home/node/app/backend"

            - name: Deploy via SSH action
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME_MAIN }}
                  key: ${{ secrets.SSHKEY }}
                  envs: password
                  script: |
                      cd /home/node/app/backend
                      aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin 228660324170.dkr.ecr.eu-west-3.amazonaws.com
                      docker-compose pull
                      sudo systemctl restart klosanow-api
