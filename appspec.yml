
version: 0.0
os: linux
files:
  - source: /
    destination: /app/web
permissions:
  - object: /home/ec2-user
    owner: ec2-user
    group: ec2-user
    type:
      - directory
      - file
hooks:
  ApplicationStop:
    - location: script/stop.sh
      timeout: 150
      runas: root
  BeforeInstall:
    - location: script/pre-install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: script/start.sh
      timeout: 500
      runas: root